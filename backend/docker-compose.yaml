services:
  postgres:
    container_name: jacob-postgres
    image: postgres
    environment:
      POSTGRES_DB: jacob
      POSTGRES_USER: jacob
      POSTGRES_PASSWORD: jacob
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - 5432:5432
    networks:
      - postgres
    restart: unless-stopped

  whisper:
    container_name: jacob-whisper
    build:
      context: ./whisper
      dockerfile: Dockerfile
    image: jacob-whisper:local
    entrypoint: [whisper-server]
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --language
      - fr
      - --model
      - /models/ggml-base-q5_1.bin
    volumes:
      - ./models:/models:ro
    ports:
      - 127.0.0.1:8081:8080
    restart: unless-stopped

networks:
  postgres:
    driver: bridge

volumes:
  postgres: