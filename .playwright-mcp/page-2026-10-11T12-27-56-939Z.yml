            - text: . Certains contenus ne sont pas disponibles dans certaines résolutions ou en qualité audio Dolby Atmos/5.1. La plupart des contenus Dolby Atmos sont en anglais uniquement.
            - link "Cliquez ici pour en savoir plus" [ref=f11e439] [cursor=pointer]:
              - /url: https://help.disneyplus.com/article/disneyplus-sound-quality/?utm_source=disneyplus&utm_medium=web&utm_campaign=comp-chart&utm_content=sound-quality
            - text: .
            - superscript [ref=f11e440]: "3"
            - text: Tous les abonnements incluent des promotions et des messages de parrainage Disney. Tous peuvent également inclure des publicités avant/après la lecture des contenus ainsi que dans les chaînes, les programmes en direct ou en léger différé, les événements spéciaux, et les contenus tiers à la demande.
            - superscript [ref=f11e441]: "4"
            - text: "Les appareils actuellement compatibles incluent : les appareils Android TV, y compris certains modèles de Google, Philips, Sony et autres ; Amazon Fire TV ; les téléviseurs LG à partir de 2020; Sky Glass ; et Sky Stream. La compatibilité, la prise en charge et la disponibilité de la 4K UHD peuvent varier et évoluer. Consultez"
            - link "cette page" [ref=f11e442] [cursor=pointer]:
