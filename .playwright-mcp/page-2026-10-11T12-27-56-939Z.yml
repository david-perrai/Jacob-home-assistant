            - superscript [ref=f11e436]: "1"
            - text: Sur la base d'une durée minimale de 6 mois, puis application du tarif alors en vigueur (actuellement 15,99 €/mois pour Premium, 10,99 €/mois pour Standard ou 6,99 €/mois pour Standard avec pub), sauf si vous résiliez votre abonnement avant. Économies par rapport au tarif mensuel actuel de l'abonnement choisi.
            - superscript [ref=f11e437]: "2"
            - text: La qualité audio et vidéo dépend du débit Internet, des capacités de votre appareil et de la configuration de la plateforme.
            - link "Cliquez ici pour en savoir plus" [ref=f11e438] [cursor=pointer]:
