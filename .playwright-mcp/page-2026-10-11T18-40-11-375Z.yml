                - heading [level=2]
                - paragraph [ref=e95]:
                  - text: "Une recette de cuisine chinoise que j’adore : le riz cantonais. Ici, une version traditionnelle, très facile à refaire à la maison et pleine de goût. La recette est pour 4/6 personnes, et peut se décliner en version végétarienne, ou poulet ou crevettes. J’ai trouvé les saucisses chinoises (parfumées et un peu sucrées, dans un supermarché asiatique à Paris, pour info). Si la cuisine chinoise vous plait, découvrez une autre recette réalisée avec Margot :"
                  - link "le boeuf sauté aux oignons." [ref=e96] [cursor=pointer]:
                    - /url: https://www.hervecuisine.com/recette/boeuf-saute-aux-oignons-recette-de-cuisine-chinoise/
