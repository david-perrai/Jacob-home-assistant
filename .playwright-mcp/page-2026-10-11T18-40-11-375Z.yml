                - generic [ref=e126]:
                  - heading "Liste des ingrédients" [level=2] [ref=e127]
                  - list [ref=e129]:
                    - listitem [ref=e130]: 300 g de riz cuit (pour 4 personnes)
                    - listitem [ref=e131]: 100 g de maïs en grain
                    - listitem [ref=e132]: 100 g de petits pois surgelés
                    - listitem [ref=e133]: 50 g de saucisse chinoise de canton (ou chorizo doux ou saucisse de Morteau)
                    - listitem [ref=e134]: 2 œufs
                    - listitem [ref=e135]: 1 carotte
                    - listitem [ref=e136]: 1 c. à soupe d'huile de tournesol
                    - listitem [ref=e137]: 2 ciboules ou oignons nouveaux
                    - listitem [ref=e138]: 1 c. à soupe de sauce de soja
                    - listitem [ref=e139]: Sel et poivre
                - generic [ref=e140]:
                  - heading "Etapes de la recette" [level=2] [ref=e141]
                  - list [ref=e142]:
                    - listitem [ref=e143]: Epluchez la carotte, découpez en petits cubes ainsi que les ciboules (ou oignons)
                    - listitem [ref=e144]: Découpez les saucisses en petits cubes également (vous pouvez les remplacer par des dés de poulet, des petites crevettes etc.) et faites-les revenir dans une poêle anti-adhésive avec l'huile quelques minutes
                    - listitem [ref=e145]: Ajoutez alors les carottes, laissez dorer 5 minutes en ajoutant la sauce soja
                    - listitem [ref=e146]: Ajoutez le riz déjà cuit, mélangez bien pour décoller les grains de riz
                    - listitem [ref=e147]: Ajoutez l'oignon (ou ciboule), le sel, et mélangez. Versez alors les oeufs battus sur le riz directement et mélangez pour que l'oeuf se répartisse bien sur tout le riz, mélangez bien pour décoller les grains de riz à nouveau
                    - listitem [ref=e148]: Ajoutez enfin le maïs et les petits pois, poivrez et poursuivez la cuisson 2 minutes, c'est prêt !
